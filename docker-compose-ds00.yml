version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15
    container_name: ds00_db
    environment:
      POSTGRES_DB: ds00_commentbot
      POSTGRES_USER: ds00_user
      POSTGRES_PASSWORD: ds00_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c deadlock_timeout=1s
      -c lock_timeout=10s
      -c statement_timeout=30s
      -c idle_in_transaction_session_timeout=60s
    volumes:
      - ds00_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Изменим порт чтобы не конфликтовать
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds00_user"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ds00_postgres_data:
