version: '3.8'

services:
  bot:
    build: .
    container_name: commentbot
    environment:
      - DATABASE_URL=sqlite:///data/commentbot.db
    env_file:
      - .env
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./schedule.json:/app/schedule.json
      - ./data:/app/data
    restart: unless-stopped
    user: "0:0"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
        reservations:
          memory: 2G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://api.telegram.org/bot${BOT_TOKEN}/getMe')"]
      interval: 60s
      timeout: 10s
      retries: 3
