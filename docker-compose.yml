services:
  postgres:
    image: postgres:15
    container_name: ${PROJECT_NAME:-telegrambot}_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  bot:
    build: .
    container_name: ${PROJECT_NAME:-telegrambot}_bot
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bot_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telegram_bot}
    env_file:
      - .env
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./schedule.json:/app/schedule.json
      - ./data:/app/data
    restart: unless-stopped
    user: "0:0"
    depends_on:
      - postgres

volumes:
  postgres_data:
