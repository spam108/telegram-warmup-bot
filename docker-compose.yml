version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-warmup-bot
    restart: unless-stopped
    volumes:
      - ./sessions:/app/sessions
      - ./schedule.json:/app/schedule.json
      - ./bot.db:/app/bot.db  # Монтируем SQLite файл
    env_file:
      - .env
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
